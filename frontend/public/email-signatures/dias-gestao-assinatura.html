<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinatura de e-mail - Dias Gestão</title>
  <style>
    @media only screen and (max-width: 520px) {
      .signature-container { width: 100% !important; }
      .signature-stack { display: block !important; width: 100% !important; }
      .signature-logo-cell { padding: 0 0 14px 0 !important; }
      .signature-info-cell { padding: 14px 0 0 0 !important; }
      .signature-divider { display: none !important; }
    }
  </style>
</head>
<body style="margin:0; padding:24px; background:#f6f8fb;">
  <!--
    ASSINATURA DIAS GESTAO
    Para usar: edite os campos indicados nos comentarios abaixo, abra este HTML no navegador,
    selecione a assinatura renderizada e copie para o Gmail, Outlook ou webmail.
  -->

  <!-- CORES DA MARCA: principal #0E4B55, secundaria #30343B, destaque #1F8A9B. -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="signature-container" style="width:600px; max-width:600px; border-collapse:collapse; font-family:Arial, Helvetica, sans-serif; color:#1f2937; background:#ffffff;">
    <tr>
      <td style="padding:0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
          <tr>
            <td width="150" valign="middle" class="signature-stack signature-logo-cell" style="width:150px; padding:0 20px 0 0; vertical-align:middle; text-align:left;">
              <!-- EDITE A LOGO: troque o src por uma URL publica HTTPS da logo da Dias Gestão. Evite arquivo local e base64. -->
              <a href="https://www.diasgestao.com.br" target="_blank" style="text-decoration:none;">
                <img src="https://www.diasgestao.com.br/logo-email.png" width="128" alt="Dias Gestão" style="display:block; width:128px; max-width:128px; height:auto; border:0; outline:none; text-decoration:none;">
              </a>

              <!-- Texto de apoio caso a imagem seja bloqueada pelo cliente de e-mail. -->
              <div style="margin-top:10px; font-size:12px; line-height:16px; font-weight:700; color:#0E4B55;">
                Dias<br>Gestão
              </div>
            </td>

            <td width="1" class="signature-divider" style="width:1px; background:#D8DEE6; font-size:0; line-height:0;">&nbsp;</td>

            <td valign="middle" class="signature-stack signature-info-cell" style="padding:0 0 0 20px; vertical-align:middle;">
              <!-- EDITE O NOME COMPLETO -->
              <div style="font-size:20px; line-height:24px; font-weight:700; color:#0E4B55;">
                NOME DO COLABORADOR
              </div>

              <!-- EDITE O CARGO -->
              <div style="margin-top:3px; font-size:13px; line-height:18px; color:#30343B; font-weight:600;">
                CARGO DO COLABORADOR
              </div>

              <div style="height:12px; line-height:12px; font-size:12px;">&nbsp;</div>

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; font-size:13px; line-height:19px; color:#374151;">
                <tr>
                  <td width="24" valign="top" style="width:24px; color:#1F8A9B; font-size:13px; line-height:19px; font-weight:700; text-align:center;">&#9742;</td>
                  <td valign="top">
                    <!-- EDITE O TELEFONE / WHATSAPP -->
                    <a href="tel:+5500000000000" style="color:#374151; text-decoration:none;">(00) 00000-0000</a>
                  </td>
                </tr>
                <tr>
                  <td width="24" valign="top" style="width:24px; color:#1F8A9B; font-size:13px; line-height:19px; font-weight:700; text-align:center;">&#9993;</td>
                  <td valign="top">
                    <!-- EDITE O E-MAIL -->
                    <a href="mailto:email@diasgestao.com.br" style="color:#374151; text-decoration:none;">email@diasgestao.com.br</a>
                  </td>
                </tr>
                <tr>
                  <td width="24" valign="top" style="width:24px; color:#1F8A9B; font-size:13px; line-height:19px; font-weight:700; text-align:center;">&#127760;</td>
                  <td valign="top">
                    <!-- EDITE O SITE -->
                    <a href="https://www.diasgestao.com.br" target="_blank" style="color:#0E4B55; text-decoration:none; font-weight:700;">www.diasgestao.com.br</a>
                  </td>
                </tr>
                <tr>
                  <td width="24" valign="top" style="width:24px; color:#1F8A9B; font-size:13px; line-height:19px; font-weight:700; text-align:center;">&#9678;</td>
                  <td valign="top">
                    <!-- EDITE AS REDES SOCIAIS ou remova esta linha se nao usar. -->
                    <a href="https://www.instagram.com/diasgestao" target="_blank" style="color:#374151; text-decoration:none;">Instagram</a>
                    <span style="color:#9CA3AF;"> | </span>
                    <a href="https://www.linkedin.com/company/dias-gestao" target="_blank" style="color:#374151; text-decoration:none;">LinkedIn</a>
                  </td>
                </tr>
                <!--
                ENDERECO OPCIONAL: remova este comentario e edite a linha abaixo se quiser exibir endereco.
                <tr>
                  <td width="24" valign="top" style="width:24px; color:#1F8A9B; font-size:13px; line-height:19px; font-weight:700; text-align:center;">&#8982;</td>
                  <td valign="top" style="color:#374151;">ENDERECO DA EMPRESA</td>
                </tr>
                -->
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td style="padding-top:14px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
          <tr>
            <td style="border-top:1px solid #E5E7EB; padding-top:10px; font-size:11px; line-height:16px; color:#30343B;">
              <!-- EDITE OU REMOVA A FRASE INSTITUCIONAL -->
              Gestão estratégica com eficiência e credibilidade.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
